name: Pytest Coverage

# Issue #1035 — enforce a minimum pytest coverage on every pull request and post
# a coverage-delta breakdown as a PR comment.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pytest-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Total coverage (lines + branches, as reported by coverage.py) below this
  # value fails the pull-request check.
  COVERAGE_THRESHOLD: "80"
  # app.db.session requires a URL at import time; tests never connect to it.
  DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/stellarflow

jobs:
  coverage:
    name: Pytest coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt \
            pytest pytest-asyncio pytest-cov httpx \
            sqlalchemy alembic aiosqlite sentry-sdk \
            opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp

      # Best-effort baseline so the comment can show a delta. Failures here must
      # never fail the PR: the base branch is not what is being judged.
      - name: Measure base-branch coverage
        continue-on-error: true
        run: |
          git worktree add ../base "${{ github.event.pull_request.base.sha }}"
          cd ../base
          python -m pytest --ignore=tests/integration \
            --continue-on-collection-errors \
            --cov=app --cov-report=xml:"$GITHUB_WORKSPACE/coverage-base.xml" \
            -q -p no:cacheprovider || true

      - name: Run tests with coverage
        # Unit tests only — tests/integration needs Docker and runs in ci.yml.
        run: |
          python -m pytest --ignore=tests/integration \
            --cov=app --cov-report=xml --cov-report=term-missing \
            --cov-fail-under="$COVERAGE_THRESHOLD" \
            -q -p no:cacheprovider

      - name: Build coverage report
        if: always()
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
            -- 'app/*.py' 'app/**/*.py' > changed-files.txt || true
          if [ -f coverage.xml ]; then
            python scripts/coverage_report.py \
              --head coverage.xml \
              --base coverage-base.xml \
              --threshold "$COVERAGE_THRESHOLD" \
              --changed-files changed-files.txt \
              --output coverage-summary.md > /dev/null || true
            cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "coverage.xml was not produced; see the test step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post coverage comment
        if: always() && hashFiles('coverage-summary.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage-summary.md', 'utf8');
            const marker = '<!-- pytest-coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            try {
              // Update our previous comment instead of adding one per push.
              const comments = await github.paginate(
                github.rest.issues.listComments, { owner, repo, issue_number });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment(
                  { owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment(
                  { owner, repo, issue_number, body });
              }
            } catch (err) {
              // Pull requests from forks get a read-only token. The gate still
              // applies and the report is in the job summary, so don't fail.
              core.warning(`Could not post coverage comment: ${err.message}`);
            }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: |
            coverage.xml
            coverage-base.xml
            coverage-summary.md
          if-no-files-found: ignore
